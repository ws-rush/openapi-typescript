name: Publish Any Commit
on: [push, pull_request]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Prepare packages for publishing
        run: find packages -name package.json -exec sed -i 's/"workspace:\^"/"*" /' {} \;

      - run: pnpm dlx pkg-pr-new publish --pnpm './packages/*'
